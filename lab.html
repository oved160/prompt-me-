<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt Me — recognition lab</title>
<style>
    :root { color-scheme: dark; }
    body {
        margin: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        background: #0b0b0d; color: #f2efe9;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
    }
    h1 { font-size: 1.1rem; margin: 0 0 4px; }
    p.note { margin: 0 0 16px; color: #9d9a94; font-size: 0.8125rem; }
    button {
        display: block; width: 100%; min-height: 52px; margin-bottom: 10px;
        border: 1px solid #34323a; border-radius: 12px;
        background: #17171b; color: inherit; font: inherit; font-weight: 600;
    }
    button.run { background: #f2efe9; color: #0b0b0d; border-color: #f2efe9; }
    button:disabled { opacity: .4; }
    .verdict {
        margin: 14px 0; padding: 12px; border-radius: 10px;
        background: #17171b; border: 1px solid #34323a;
        font-size: 0.875rem; white-space: pre-wrap;
    }
    pre {
        margin: 0; padding: 12px; max-height: 46vh; overflow: auto;
        background: #08080a; border: 1px solid #26262c; border-radius: 10px;
        font: 11px/1.45 ui-monospace, monospace; white-space: pre-wrap;
        word-break: break-word; user-select: all;
    }
    video { width: 1px; height: 1px; position: absolute; opacity: 0; }
</style>
</head>
<body>

<h1>Recognition lab</h1>
<p class="note">
    Each test runs for 15 seconds. <strong>Talk continuously</strong> through the whole
    window, in the language set below. Nothing here touches the main app.
</p>

<label class="note" for="lang">Language</label>
<select id="lang" style="width:100%;min-height:44px;margin:6px 0 16px;background:#17171b;color:inherit;border:1px solid #34323a;border-radius:10px;">
    <option value="he-IL">עברית (he-IL)</option>
    <option value="en-US">English (en-US)</option>
</select>

<button class="run" id="a">TEST A — recognition only, no recorder</button>
<button class="run" id="b">TEST B — recorder only, no recognition</button>
<button class="run" id="c">TEST C — both, recogniser uses its own mic</button>
<button class="run" id="d">TEST D — both, recogniser given the shared track</button>
<button id="copy">Copy log</button>

<div class="verdict" id="verdict">No test run yet.</div>
<pre id="log"></pre>
<video id="preview" muted playsinline></video>

<script src="lab.js"></script>
</body>
</html>
